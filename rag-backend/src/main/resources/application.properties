spring.application.name=rag-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://postgres:5432/ragdb
spring.datasource.username=raguser
spring.datasource.password=ragpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=your-256-bit-secret-key-change-this-in-production-please
jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

ai-service.base-url=http://rag-ai-service:8000
